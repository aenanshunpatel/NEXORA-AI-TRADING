
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI - Crypto Intelligence</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:#f4f7ff;
 font-family:Arial,sans-serif;
}
header{
 padding:22px;
 background:#101a2c;
 border-bottom:1px solid #26344b;
}
.logo{
 font-size:25px;
 font-weight:900;
 color:#66d9ff;
}
header p{color:#9baec7;font-size:13px}
main{
 padding:18px;
 max-width:1100px;
 margin:auto;
}
h2{font-size:19px}
.cards{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.card{
 background:#111d30;
 border:1px solid #263b55;
 border-radius:14px;
 padding:16px;
}
.label{color:#9baec7;font-size:12px}
.price{
 font-size:23px;
 font-weight:bold;
 margin:10px 0;
}
.green{color:#32dfa0}
.chart{
 background:#111d30;
 border-radius:14px;
 padding:16px;
 margin-top:18px;
}
#tradingview_chart{
 height:450px;
 width:100%;
}
.analysis{
 background:#111d30;
 border:1px solid #263b55;
 border-radius:14px;
 padding:18px;
 margin-top:18px;
}
button{
 background:#1679df;
 color:white;
 border:0;
 border-radius:9px;
 padding:12px 18px;
 font-weight:bold;
}
footer{
 text-align:center;
 padding:30px;
 color:#8394aa;
 font-size:12px;
}
@media(max-width:400px){
 .price{font-size:19px}
 #tradingview_chart{height:380px}
}
</style>
</head>

<body>

<header>
 <div class="logo">✦ NEXORA AI</div>
 <p>ADVANCED CRYPTO TRADING ASSISTANT</p>
</header>

<main>

<h2>Market Overview</h2>

<div class="cards">
 <div class="card">
  <div class="label">BITCOIN · BTC</div>
  <div class="price" id="btc">$ --</div>
  <div class="green">BTC / USDT</div>
 </div>

 <div class="card">
  <div class="label">ETHEREUM · ETH</div>
  <div class="price" id="eth">$ --</div>
  <div class="green">ETH / USDT</div>
 </div>
</div>

<div class="chart">
 <h2>BTC Live Trading Chart</h2>
 <div id="tradingview_chart"></div>
 <p class="label">Live chart powered by TradingView</p>
</div>

<div class="analysis">
 <h2>AI Market Analysis</h2>
 <p id="status">Analysis engine is being prepared.</p>
 <button onclick="alert('AI Analysis module is coming soon!')">
  Start AI Analysis
 </button>
</div>

</main>

<footer>NEXORA AI · Crypto Intelligence Platform</footer>

<script>

// TRADINGVIEW LIVE CHART
const tvScript = document.createElement("script");
tvScript.src = "https://s3.tradingview.com/tv.js";

tvScript.onload = function(){
 new TradingView.widget({
  autosize:true,
  symbol:"BINANCE:BTCUSDT",
  interval:"1",
  timezone:"Asia/Kolkata",
  theme:"dark",
  style:"1",
  locale:"en",
  enable_publishing:false,
  allow_symbol_change:true,
  container_id:"tradingview_chart"
 });
};

document.head.appendChild(tvScript);


// BINANCE REAL-TIME PRICE STREAM
function connectLivePrices(){

 const socket = new WebSocket(
  "wss://stream.binance.com:9443/stream?streams=btcusdt@trade/ethusdt@trade"
 );

 socket.onmessage = function(event){

  try{
   const message = JSON.parse(event.data);
   const trade = message.data;

   if(!trade || !trade.s || !trade.p) return;

   const price = Number(trade.p).toLocaleString("en-US",{
    minimumFractionDigits:2,
    maximumFractionDigits:2
   });

   if(trade.s === "BTCUSDT"){
    document.getElementById("btc").textContent="$"+price;
   }

   if(trade.s === "ETHUSDT"){
    document.getElementById("eth").textContent="$"+price;
   }

  }catch(error){
   console.log("Price Error:",error);
  }
 };

 socket.onclose = function(){
  setTimeout(connectLivePrices,5000);
 };

 socket.onerror = function(){
  socket.close();
 };

}

connectLivePrices();

</script>
<script src="/static/market_structure.js"></script>
</body>
</html>
