
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXORA AI - Crypto Intelligence</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:22px;background:#101a2c;border-bottom:1px solid #26344b}
.logo{font-size:25px;font-weight:900;color:#66d9ff}
header p{color:#9baec7;font-size:13px}
main{padding:18px;max-width:1100px;margin:auto}
h2{font-size:19px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:#111d30;border:1px solid #263b55;border-radius:14px;padding:16px}
.label{color:#9baec7;font-size:12px}
.price{font-size:23px;font-weight:bold;margin:10px 0}
.green{color:#32dfa0}
.chart{background:#111d30;border-radius:14px;padding:16px;margin-top:18px}
canvas{width:100%;height:220px}
.analysis{background:#111d30;border:1px solid #263b55;border-radius:14px;padding:18px;margin-top:18px}
button{background:#1679df;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:bold}
footer{text-align:center;padding:30px;color:#8394aa;font-size:12px}
@media(max-width:400px){.price{font-size:19px}}
</style>
</head>
<body>
<header>
<div class="logo">✦ NEXORA AI</div>
<p>ADVANCED CRYPTO TRADING ASSISTANT</p>
</header>
<main>
<h2>Market Overview</h2>
<div class="cards">
<div class="card">
<div class="label">BITCOIN · BTC</div>
<div class="price" id="btc">$ --</div>
<div class="green">BTC / USDT</div>
</div>
<div class="card">
<div class="label">ETHEREUM · ETH</div>
<div class="price" id="eth">$ --</div>
<div class="green">ETH / USDT</div>
</div>
</div>
<div class="chart">
<h2>BTC Market Chart</h2>
<canvas id="chart"></canvas>
<p class="label">Chart visualization is currently simulated.</p>
</div>
<div class="analysis">
<h2>AI Market Analysis</h2>
<p id="status">Analysis engine is being prepared.</p>
<button onclick="alert('AI Analysis module is coming soon!')">Start AI Analysis</button>
</div>
</main>
<footer>NEXORA AI · Crypto Intelligence Platform</footer>
<script>
const canvas=document.getElementById("chart");
const ctx=canvas.getContext("2d");
function draw(){
const w=canvas.clientWidth,h=220;
const dpr=window.devicePixelRatio||1;
canvas.width=w*dpr;canvas.height=h*dpr;
ctx.scale(dpr,dpr);
ctx.strokeStyle="#263b55";
ctx.lineWidth=1;
for(let y=20;y<h;y+=40){
ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();
}
let vals=[145,130,150,115,125,95,110,80,100,65,85,55,70,35,60,30,45];
const step=w/(vals.length+1);
vals.forEach((v,i)=>{
let x=(i+1)*step;
let up=i%3!==0;
ctx.strokeStyle=up?"#32dfa0":"#ff647c";
ctx.fillStyle=ctx.strokeStyle;
ctx.beginPath();ctx.moveTo(x,v-14);ctx.lineTo(x,v+14);ctx.stroke();
ctx.fillRect(x-4,v-8,8,16);
});
}
draw();
window.addEventListener("resize",draw);

async function updatePrices(){
try{
const response=await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin%2Cethereum&vs_currencies=usd");
if(!response.ok)throw new Error("Price unavailable");
const data=await response.json();
document.getElementById("btc").textContent="$"+data.bitcoin.usd.toLocaleString("en-US");
document.getElementById("eth").textContent="$"+data.ethereum.usd.toLocaleString("en-US");
}catch(error){
console.log("Live Price Error:",error);
}
}
updatePrices();
setInterval(updatePrices,30000);
</script>
</body>
</html>
